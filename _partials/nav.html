<!-- NAV_START -->
<a href="#main-content" class="sc-skip-link">Skip to content</a>
<style>
  .sc-skip-link {
    position: absolute; left: -9999px; top: 0; z-index: 200;
    background: #0E7231; color: #fff; padding: 12px 20px;
    border-radius: 0 0 8px 0; font-family: 'Inter', system-ui, sans-serif;
    font-weight: 600; font-size: 14px; text-decoration: none;
  }
  .sc-skip-link:focus { left: 0; }
  .sc-nav-links { display: flex; gap: 28px; }
  .sc-nav-cta {
    background: #0E7231; color: #fff; padding: 12px 22px; border-radius: 999px;
    font-weight: 600; font-size: 14px; text-decoration: none;
    display: inline-flex; align-items: center; justify-content: center;
    min-height: 44px; box-sizing: border-box;
  }
  #scNavToggle { display: none; }
  @media (max-width: 767px) {
    .sc-nav-links { display: none; }
    #scNavToggle {
      display: flex; align-items: center; justify-content: center;
      width: 44px; height: 44px; border: 0; background: none; cursor: pointer;
      font-size: 22px; color: #000; padding: 0;
    }
    .sc-nav-links.open {
      display: flex; flex-direction: column; gap: 4px;
      position: absolute; top: 100%; left: 0; right: 0;
      background: #fff; border-bottom: 1px solid #eee; padding: 8px 24px 20px;
      z-index: 99;
    }
    .sc-nav-links.open a { padding: 12px 0; min-height: 44px; display: flex; align-items: center; }
  }
</style>
<nav style="width:100%;border-bottom:1px solid #eee;font-family:'Inter',system-ui,sans-serif;position:sticky;top:0;z-index:100;background:#fff;">
  <div style="max-width:1120px;margin:0 auto;padding:16px 24px;display:flex;justify-content:space-between;align-items:center;position:relative;">
    <a href="/" style="display:flex;align-items:center;"><img src="/logo.png" alt="Source Capital" style="height:36px;width:auto;"></a>
    <div class="sc-nav-links" id="scNavLinks" style="font-size:14px;font-weight:500;">
      <a href="/" data-path="/" style="text-decoration:none;color:#000;">Home</a>
      <a href="/services/" data-path="/services/" style="text-decoration:none;color:#000;">Services</a>
      <a href="/how-it-works/" data-path="/how-it-works/" style="text-decoration:none;color:#000;">How It Works</a>
      <a href="/about/" data-path="/about/" style="text-decoration:none;color:#000;">About</a>
      <a href="/resources/" data-path="/resources/" style="text-decoration:none;color:#000;">Resources</a>
      <a href="/contact/" data-path="/contact/" style="text-decoration:none;color:#000;">Contact</a>
    </div>
    <div style="display:flex;align-items:center;gap:6px;">
      <a href="/contact/" class="sc-nav-cta">Book a Call</a>
      <button id="scNavToggle" aria-expanded="false" aria-controls="scNavLinks" aria-label="Menu">&#9776;</button>
    </div>
  </div>
</nav>
<script>
  (function () {
    var path = window.location.pathname;
    document.querySelectorAll('#scNavLinks a').forEach(function (a) {
      var target = a.getAttribute('data-path');
      var isActive = target === '/' ? (path === '/' || path === '/index.html') : path.indexOf(target) === 0;
      a.style.color = isActive ? '#0E7231' : '#000';
    });

    var toggle = document.getElementById('scNavToggle');
    var links = document.getElementById('scNavLinks');
    if (toggle && links) {
      function closeMenu() {
        links.classList.remove('open');
        toggle.setAttribute('aria-expanded', 'false');
      }
      function openMenu() {
        links.classList.add('open');
        toggle.setAttribute('aria-expanded', 'true');
      }
      toggle.addEventListener('click', function () {
        if (links.classList.contains('open')) { closeMenu(); } else { openMenu(); }
      });
      links.querySelectorAll('a').forEach(function (a) {
        a.addEventListener('click', closeMenu);
      });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') closeMenu();
      });
    }
  })();
</script>
<!-- NAV_END -->
